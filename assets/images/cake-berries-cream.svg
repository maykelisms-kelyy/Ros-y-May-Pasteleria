<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E099"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772F"/>
    </linearGradient>
    <filter id="cakeGlowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C5A059" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgB)"/>

  <!-- Cake Board -->
  <ellipse cx="300" cy="360" rx="150" ry="18" fill="#FFFDF9" stroke="url(#goldB)" stroke-width="2.5"/>

  <!-- Semi-Naked Floral Berry Cake -->
  <g filter="url(#cakeGlowB)">
    <!-- Base Layer Sponge (Naked cake look) -->
    <rect x="200" y="270" width="200" height="80" rx="12" fill="#E6BA88" stroke="#D4A373" stroke-width="1.5"/>
    <!-- Cream frosting swipe -->
    <path d="M200 285 C230 280, 270 290, 310 282 C350 275, 380 288, 400 280 L400 310 C380 320, 340 305, 300 315 C260 325, 220 310, 200 318 Z" fill="#FFFDF9" opacity="0.9"/>

    <!-- Middle Cream Filling -->
    <rect x="202" y="260" width="196" height="15" rx="4" fill="#FFFDF9"/>

    <!-- Top Layer Sponge -->
    <rect x="200" y="180" width="200" height="80" rx="12" fill="#E6BA88" stroke="#D4A373" stroke-width="1.5"/>
    <!-- Cream scrape -->
    <path d="M200 195 C240 190, 280 200, 320 192 C360 185, 390 195, 400 190 L400 220 C370 230, 330 215, 290 225 C250 235, 215 220, 200 228 Z" fill="#FFFDF9" opacity="0.9"/>

    <!-- Top Frosting Flat -->
    <ellipse cx="300" cy="180" rx="100" ry="24" fill="#FFFDF9" stroke="#E6BA88" stroke-width="1.5"/>

    <!-- Fresh Strawberries, Blueberries, Eucalyptus sprigs on Top -->
    <!-- Strawberry 1 -->
    <polygon points="260,150 280,180 240,180" fill="#E63946"/>
    <circle cx="260" cy="170" r="1.5" fill="#FFFDF9"/>
    <circle cx="255" cy="165" r="1.5" fill="#FFFDF9"/>
    <circle cx="268" cy="168" r="1.5" fill="#FFFDF9"/>
    <path d="M255 150 L260 144 L265 150" stroke="#588157" stroke-width="2"/>

    <!-- Strawberry 2 -->
    <polygon points="310,145 330,175 290,175" fill="#E63946"/>
    <circle cx="310" cy="165" r="1.5" fill="#FFFDF9"/>
    <circle cx="305" cy="160" r="1.5" fill="#FFFDF9"/>
    <circle cx="318" cy="162" r="1.5" fill="#FFFDF9"/>
    <path d="M305 145 L310 139 L315 145" stroke="#588157" stroke-width="2"/>

    <!-- Blueberries -->
    <circle cx="335" cy="170" r="8" fill="#3D405B"/>
    <circle cx="348" cy="175" r="7" fill="#3D405B"/>
    <circle cx="240" cy="178" r="8" fill="#3D405B"/>

    <!-- Eucalyptus & Floral accents -->
    <ellipse cx="355" cy="160" rx="12" ry="6" fill="#84A59D" transform="rotate(-30 355 160)"/>
    <ellipse cx="370" cy="150" rx="10" ry="5" fill="#84A59D" transform="rotate(-40 370 150)"/>
    <ellipse cx="230" cy="160" rx="12" ry="6" fill="#84A59D" transform="rotate(30 230 160)"/>

    <!-- Delicate White Blossom -->
    <circle cx="285" cy="178" r="7" fill="#FFFFFF" stroke="#F8B4C4" stroke-width="1"/>
    <circle cx="285" cy="178" r="2.5" fill="url(#goldB)"/>
  </g>
</svg>

