<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FFF3F6"/>
      <stop offset="100%" stop-color="#FCE4EC"/>
    </linearGradient>
    <linearGradient id="goldM2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E099"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772F"/>
    </linearGradient>
    <filter id="cakeGlowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C5A059" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgM)"/>

  <!-- Golden Pedestal Stand -->
  <ellipse cx="300" cy="380" rx="140" ry="16" fill="url(#goldM2)"/>
  <path d="M285 380 L290 410 L310 410 L315 380 Z" fill="url(#goldM2)"/>
  <ellipse cx="300" cy="410" rx="50" ry="8" fill="url(#goldM2)"/>

  <!-- Macaron Pyramidal Tiered Tower -->
  <g filter="url(#cakeGlowM)">
    <!-- Bottom Tier 1 (7 Macarons) -->
    <g transform="translate(180, 335)">
      <!-- Macaron items -->
      <ellipse cx="20" cy="0" rx="18" ry="9" fill="#F8B4C4"/>
      <ellipse cx="55" cy="0" rx="18" ry="9" fill="#FFFDF9" stroke="#E5D6C5"/>
      <ellipse cx="90" cy="0" rx="18" ry="9" fill="#F8B4C4"/>
      <ellipse cx="125" cy="0" rx="18" ry="9" fill="#EAD5C3"/>
      <ellipse cx="160" cy="0" rx="18" ry="9" fill="#F8B4C4"/>
      <ellipse cx="195" cy="0" rx="18" ry="9" fill="#FFFDF9" stroke="#E5D6C5"/>
      <ellipse cx="230" cy="0" rx="18" ry="9" fill="#F8B4C4"/>
    </g>

    <!-- Tier 2 (6 Macarons) -->
    <g transform="translate(195, 290)">
      <ellipse cx="20" cy="0" rx="18" ry="9" fill="#FFFDF9" stroke="#E5D6C5"/>
      <ellipse cx="55" cy="0" rx="18" ry="9" fill="#DF6C8A"/>
      <ellipse cx="90" cy="0" rx="18" ry="9" fill="#F8B4C4"/>
      <ellipse cx="125" cy="0" rx="18" ry="9" fill="#EAD5C3"/>
      <ellipse cx="160" cy="0" rx="18" ry="9" fill="#F8B4C4"/>
      <ellipse cx="195" cy="0" rx="18" ry="9" fill="#FFFDF9" stroke="#E5D6C5"/>
    </g>

    <!-- Tier 3 (5 Macarons) -->
    <g transform="translate(210, 245)">
      <ellipse cx="20" cy="0" rx="18" ry="9" fill="#F8B4C4"/>
      <ellipse cx="55" cy="0" rx="18" ry="9" fill="#FFFDF9" stroke="#E5D6C5"/>
      <ellipse cx="90" cy="0" rx="18" ry="9" fill="#DF6C8A"/>
      <ellipse cx="125" cy="0" rx="18" ry="9" fill="#F8B4C4"/>
      <ellipse cx="160" cy="0" rx="18" ry="9" fill="#EAD5C3"/>
    </g>

    <!-- Tier 4 (4 Macarons) -->
    <g transform="translate(230, 200)">
      <ellipse cx="20" cy="0" rx="17" ry="8.5" fill="#FFFDF9" stroke="#E5D6C5"/>
      <ellipse cx="50" cy="0" rx="17" ry="8.5" fill="#F8B4C4"/>
      <ellipse cx="80" cy="0" rx="17" ry="8.5" fill="#DF6C8A"/>
      <ellipse cx="110" cy="0" rx="17" ry="8.5" fill="#F8B4C4"/>
    </g>

    <!-- Tier 5 (3 Macarons) -->
    <g transform="translate(250, 155)">
      <ellipse cx="15" cy="0" rx="16" ry="8" fill="#F8B4C4"/>
      <ellipse cx="50" cy="0" rx="16" ry="8" fill="#FFFDF9" stroke="#E5D6C5"/>
      <ellipse cx="85" cy="0" rx="16" ry="8" fill="#F8B4C4"/>
    </g>

    <!-- Tier 6 (2 Macarons) -->
    <g transform="translate(270, 115)">
      <ellipse cx="15" cy="0" rx="15" ry="7.5" fill="#DF6C8A"/>
      <ellipse cx="45" cy="0" rx="15" ry="7.5" fill="#F8B4C4"/>
    </g>

    <!-- Apex Top Macaron with Rose -->
    <g transform="translate(300, 80)">
      <ellipse cx="0" cy="0" rx="15" ry="8" fill="#FFFDF9" stroke="url(#goldM2)" stroke-width="1.5"/>
      <circle cx="0" cy="-14" r="10" fill="#F8B4C4"/>
      <circle cx="-1" cy="-15" r="6" fill="#DF6C8A"/>
    </g>

    <!-- Fresh Strawberries & Golden pearls nestled among macarons -->
    <circle cx="210" cy="315" r="4" fill="url(#goldM2)"/>
    <circle cx="380" cy="315" r="4" fill="url(#goldM2)"/>
    <circle cx="240" cy="225" r="3.5" fill="url(#goldM2)"/>
    <circle cx="360" cy="225" r="3.5" fill="url(#goldM2)"/>
    <circle cx="300" cy="180" r="4" fill="url(#goldM2)"/>
  </g>
</svg>

