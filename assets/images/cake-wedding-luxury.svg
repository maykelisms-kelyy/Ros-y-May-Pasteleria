<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FAF2E8"/>
      <stop offset="100%" stop-color="#F5E5D5"/>
    </linearGradient>
    <linearGradient id="goldW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E099"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772F"/>
    </linearGradient>
    <filter id="cakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#8C6D58" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgW)"/>
  
  <!-- Subtle background glow -->
  <circle cx="300" cy="225" r="180" fill="#FFF9F5" opacity="0.8"/>
  <circle cx="300" cy="225" r="170" fill="none" stroke="url(#goldW)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Cake Stand -->
  <g transform="translate(180, 360)">
    <ellipse cx="120" cy="25" rx="130" ry="16" fill="url(#goldW)"/>
    <path d="M100 25 L105 55 L135 55 L140 25 Z" fill="url(#goldW)"/>
    <ellipse cx="120" cy="55" rx="55" ry="10" fill="url(#goldW)"/>
  </g>

  <!-- Wedding Cake 3 Tiers -->
  <g filter="url(#cakeGlow)">
    <!-- Tier 1 (Bottom) -->
    <rect x="190" y="270" width="220" height="100" rx="14" fill="#FFFDF9" stroke="#EED8C5" stroke-width="2"/>
    <!-- Gold border ribbon -->
    <rect x="190" y="360" width="220" height="10" rx="3" fill="url(#goldW)"/>
    <!-- Piped pearl details -->
    <path d="M195 300 Q205 310 215 300 Q225 310 235 300 Q245 310 255 300 Q265 310 275 300 Q285 310 295 300 Q305 310 315 300 Q325 310 335 300 Q345 310 355 300 Q365 310 375 300 Q385 310 395 300 Q405 310 405 300" stroke="url(#goldW)" stroke-width="2" fill="none"/>

    <!-- Tier 2 (Middle) -->
    <rect x="225" y="180" width="150" height="90" rx="12" fill="#FFF8F0" stroke="#EED8C5" stroke-width="2"/>
    <rect x="225" y="260" width="150" height="10" rx="3" fill="url(#goldW)"/>
    <!-- Gentle quilted texture with pearls -->
    <path d="M230 200 L270 240 M260 190 L300 230 M290 190 L330 230 M320 190 L360 230" stroke="#FCE4EC" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Tier 3 (Top) -->
    <rect x="255" y="105" width="90" height="75" rx="10" fill="#FFFDF9" stroke="#EED8C5" stroke-width="2"/>
    <rect x="255" y="172" width="90" height="8" rx="2" fill="url(#goldW)"/>

    <!-- Cascading Sugar Roses / Flowers -->
    <!-- Top Topper Rose -->
    <circle cx="300" cy="95" r="18" fill="#F8B4C4"/>
    <circle cx="298" cy="93" r="12" fill="#DF6C8A"/>
    <circle cx="298" cy="93" r="6" fill="#FFFDF9"/>
    <!-- Leaf -->
    <path d="M315 90 C325 80, 335 95, 320 102 Z" fill="#A3B18A"/>
    
    <!-- Middle Rose cluster -->
    <circle cx="240" cy="180" r="16" fill="#FCE4EC"/>
    <circle cx="238" cy="178" r="10" fill="#F8B4C4"/>
    <circle cx="255" cy="195" r="12" fill="#DF6C8A"/>
    <path d="M230 190 C220 200, 215 185, 225 180 Z" fill="#A3B18A"/>

    <!-- Bottom Rose cluster with gold leaves -->
    <circle cx="390" cy="275" r="18" fill="#F8B4C4"/>
    <circle cx="388" cy="273" r="12" fill="#DF6C8A"/>
    <path d="M405 265 C418 260, 422 278, 408 280 Z" fill="url(#goldW)"/>
    <circle cx="370" cy="290" r="14" fill="#FFFDF9" stroke="#F8B4C4" stroke-width="2"/>
  </g>

  <!-- Sparkles -->
  <path d="M160 140 Q160 128 166 128 Q160 128 160 116 Q160 128 154 128 Q160 128 160 140 Z" fill="url(#goldW)"/>
  <path d="M440 160 Q440 148 446 148 Q440 148 440 136 Q440 148 434 148 Q440 148 440 160 Z" fill="url(#goldW)"/>
</svg>

