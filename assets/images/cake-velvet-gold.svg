<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgVG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="60%" stop-color="#FAF0EB"/>
      <stop offset="100%" stop-color="#F2DCD3"/>
    </linearGradient>
    <linearGradient id="velvetRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B2226"/>
      <stop offset="50%" stop-color="#7B181C"/>
      <stop offset="100%" stop-color="#550E11"/>
    </linearGradient>
    <linearGradient id="goldVG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E099"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9C772F"/>
    </linearGradient>
    <filter id="cakeGlowVG" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#7B181C" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgVG)"/>

  <!-- Cake Stand -->
  <ellipse cx="300" cy="360" rx="145" ry="16" fill="url(#goldVG)"/>

  <g filter="url(#cakeGlowVG)">
    <!-- Red Velvet Body with velvet crumb texture -->
    <rect x="180" y="190" width="240" height="160" rx="16" fill="url(#velvetRed)"/>
    <ellipse cx="300" cy="190" rx="120" ry="28" fill="#FFFDF9" stroke="#E5D6C5" stroke-width="2"/>

    <!-- Gold leaf flakes on velvet side -->
    <path d="M210 230 L225 220 L220 240 Z" fill="url(#goldVG)"/>
    <path d="M250 280 L260 270 L258 290 Z" fill="url(#goldVG)"/>
    <path d="M370 240 L385 235 L378 250 Z" fill="url(#goldVG)"/>
    <path d="M340 300 L350 295 L346 310 Z" fill="url(#goldVG)"/>

    <!-- Cream Cheese Frosting Crown on Top -->
    <g transform="translate(300, 190)">
      <!-- Ring of cream cheese rosettes -->
      <circle cx="-90" cy="0" r="14" fill="#FFFDF9" stroke="#FCE4EC" stroke-width="1.5"/>
      <circle cx="-65" cy="-12" r="14" fill="#FFFDF9" stroke="#FCE4EC" stroke-width="1.5"/>
      <circle cx="-35" cy="-18" r="14" fill="#FFFDF9" stroke="#FCE4EC" stroke-width="1.5"/>
      <circle cx="0" cy="-20" r="15" fill="#FFFDF9" stroke="#FCE4EC" stroke-width="1.5"/>
      <circle cx="35" cy="-18" r="14" fill="#FFFDF9" stroke="#FCE4EC" stroke-width="1.5"/>
      <circle cx="65" cy="-12" r="14" fill="#FFFDF9" stroke="#FCE4EC" stroke-width="1.5"/>
      <circle cx="90" cy="0" r="14" fill="#FFFDF9" stroke="#FCE4EC" stroke-width="1.5"/>

      <!-- Red Velvet Crumb dust in center -->
      <ellipse cx="0" cy="0" rx="40" ry="12" fill="#9B2226" opacity="0.8"/>
      
      <!-- Edible Gold Crown / Tiara topper -->
      <path d="M-30 -30 L-25 -50 L-10 -38 L0 -58 L10 -38 L25 -50 L30 -30 Z" fill="url(#goldVG)" stroke="#9C772F" stroke-width="1"/>
      <circle cx="0" cy="-58" r="3" fill="#FFFDF9"/>
      <circle cx="-25" cy="-50" r="2.5" fill="#FFFDF9"/>
      <circle cx="25" cy="-50" r="2.5" fill="#FFFDF9"/>
    </g>

    <!-- Bottom Cream Beaded Border -->
    <ellipse cx="300" cy="350" rx="122" ry="10" fill="none" stroke="#FFFDF9" stroke-width="8" stroke-dasharray="10,6"/>
  </g>
</svg>

