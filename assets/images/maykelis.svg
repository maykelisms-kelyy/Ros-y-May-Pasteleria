<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="60%" stop-color="#FFEBEF"/>
      <stop offset="100%" stop-color="#FCD5DE"/>
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DF8E"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E782F"/>
    </linearGradient>
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="50%" stop-color="#F8B4C4"/>
      <stop offset="100%" stop-color="#EE8CA3"/>
    </linearGradient>
    <filter id="shadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#DF6C8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base with soft rounded card -->
  <rect x="0" y="0" width="400" height="450" rx="36" fill="url(#bgGradM)"/>
  
  <!-- Outer Gold Decorative Filigree Ring -->
  <circle cx="200" cy="210" r="165" fill="none" stroke="url(#goldGradM)" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="200" cy="210" r="156" fill="#FFF9F5" stroke="#F8B4C4" stroke-width="1.5"/>

  <!-- Character Group: Maykelis (Administración, Publicidad & Atención al Cliente) -->
  <g transform="translate(0, 10)">
    <!-- Soft Golden Aura -->
    <circle cx="200" cy="180" r="115" fill="#FFF0F3" opacity="0.8"/>

    <!-- Hair Back (Long, elegant, softly curled) -->
    <path d="M110 180 C110 100, 290 100, 290 180 C290 270, 275 320, 260 350 C240 330, 230 300, 200 300 C170 300, 160 330, 140 350 C125 320, 110 270, 110 180 Z" fill="#2E1C14"/>

    <!-- Neck & Collarbone -->
    <path d="M182 225 L218 225 L225 275 L175 275 Z" fill="#F0C5AE"/>
    <!-- Elegant Gold Necklace -->
    <path d="M178 250 Q200 268 222 250" stroke="url(#goldGradM)" stroke-width="2.5" fill="none"/>
    <circle cx="200" cy="264" r="4.5" fill="url(#goldGradM)"/>

    <!-- Silk Inner Blouse -->
    <polygon points="175,270 200,310 225,270 240,360 160,360" fill="#FFFDF9"/>

    <!-- Elegant Tailored Blazer -->
    <path d="M130 275 C150 260, 175 270, 185 305 L160 410 L100 405 C95 350, 115 300, 130 275 Z" fill="url(#blazerGrad)" stroke="#DF6C8A" stroke-width="1.5"/>
    <path d="M270 275 C250 260, 225 270, 215 305 L240 410 L300 405 C305 350, 285 300, 270 275 Z" fill="url(#blazerGrad)" stroke="#DF6C8A" stroke-width="1.5"/>
    
    <!-- Blazer Lapels with gold edge -->
    <path d="M175 275 L195 330 L165 340 Z" fill="#F8B4C4" stroke="url(#goldGradM)" stroke-width="1"/>
    <path d="M225 275 L205 330 L235 340 Z" fill="#F8B4C4" stroke="url(#goldGradM)" stroke-width="1"/>

    <!-- Head & Face -->
    <ellipse cx="200" cy="185" rx="50" ry="58" fill="#FCD8C5"/>
    <!-- Cheeks Blush -->
    <ellipse cx="170" cy="200" rx="14" ry="8" fill="#F8B4C4" opacity="0.75"/>
    <ellipse cx="230" cy="200" rx="14" ry="8" fill="#F8B4C4" opacity="0.75"/>

    <!-- Pearl Earrings -->
    <circle cx="147" cy="195" r="5" fill="#FFFDF9" stroke="url(#goldGradM)" stroke-width="1"/>
    <circle cx="253" cy="195" r="5" fill="#FFFDF9" stroke="url(#goldGradM)" stroke-width="1"/>

    <!-- Eyes - Brilliant, engaging & attentive -->
    <ellipse cx="178" cy="178" rx="8" ry="6" fill="#2E1C14"/>
    <circle cx="176" cy="176" r="2.5" fill="#FFFFFF"/>
    <path d="M165 174 C172 168, 184 168, 191 174" stroke="#2E1C14" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M191 173 L196 170" stroke="#2E1C14" stroke-width="2" stroke-linecap="round"/>

    <ellipse cx="222" cy="178" rx="8" ry="6" fill="#2E1C14"/>
    <circle cx="220" cy="176" r="2.5" fill="#FFFFFF"/>
    <path d="M209 174 C216 168, 228 168, 235 174" stroke="#2E1C14" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M235 173 L240 170" stroke="#2E1C14" stroke-width="2" stroke-linecap="round"/>

    <!-- Styled Eyebrows -->
    <path d="M164 164 C172 158, 184 159, 192 165" stroke="#2E1C14" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M208 165 C216 159, 228 158, 236 164" stroke="#2E1C14" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Delicate Nose -->
    <path d="M198 188 Q200 194 203 192" stroke="#DCA282" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Warm, Customer-focused Radiant Smile -->
    <path d="M182 208 C190 222, 210 222, 218 208" stroke="#DF6C8A" stroke-width="3" stroke-linecap="round" fill="#FFFFFF"/>

    <!-- Hair Front Styling -->
    <path d="M145 175 C145 125, 175 115, 200 125 C225 115, 255 125, 255 175 C248 140, 225 132, 200 142 C175 132, 152 140, 145 175 Z" fill="#2E1C14"/>
    <!-- Soft Flowing curls cascading down shoulders -->
    <path d="M142 180 C130 220, 135 270, 148 310" stroke="#2E1C14" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M258 180 C270 220, 265 270, 252 310" stroke="#2E1C14" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Gold Hair Accessory / Pin -->
    <g transform="translate(142, 138) rotate(-20)">
      <circle cx="0" cy="0" r="5" fill="url(#goldGradM)"/>
      <circle cx="8" cy="0" r="4" fill="#F8B4C4"/>
      <circle cx="15" cy="0" r="3" fill="url(#goldGradM)"/>
    </g>

    <!-- Administrative / Client Planner & Heart Tablet in front -->
    <g transform="translate(145, 305)" filter="url(#shadowM)">
      <!-- Tablet / Planner -->
      <rect x="0" y="0" width="110" height="75" rx="8" fill="#FFFDF9" stroke="url(#goldGradM)" stroke-width="2"/>
      <!-- Header bar in tablet -->
      <rect x="0" y="0" width="110" height="18" rx="8" fill="#FCE4EC"/>
      <circle cx="15" cy="9" r="3" fill="#DF6C8A"/>
      <circle cx="26" cy="9" r="3" fill="url(#goldGradM)"/>
      <text x="55" y="13" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#8C5A61" text-anchor="middle">ATENCIÓN &amp; PEDIDOS</text>
      <!-- Content lines / Calendar icons -->
      <line x1="15" y1="28" x2="65" y2="28" stroke="#DF6C8A" stroke-width="2" stroke-linecap="round"/>
      <line x1="15" y1="36" x2="85" y2="36" stroke="#C5A059" stroke-width="2" stroke-linecap="round"/>
      <line x1="15" y1="44" x2="55" y2="44" stroke="#F8B4C4" stroke-width="2" stroke-linecap="round"/>
      <!-- Heart sticker -->
      <path d="M90 45 C86 40, 78 45, 84 52 L90 58 L96 52 C102 45, 94 40, 90 45 Z" fill="#DF6C8A"/>
      <!-- Golden Stylus Pen -->
      <line x1="95" y1="18" x2="115" y2="-2" stroke="url(#goldGradM)" stroke-width="3" stroke-linecap="round"/>
      <polygon points="95,18 92,23 98,20" fill="#3B2E2A"/>
    </g>

    <!-- Chat / Customer speech bubble floating -->
    <g transform="translate(60, 110)" filter="url(#shadowM)">
      <rect x="0" y="0" width="65" height="34" rx="12" fill="#FFFDF9" stroke="url(#goldGradM)" stroke-width="1.5"/>
      <path d="M45 34 L52 42 L52 34 Z" fill="#FFFDF9" stroke="url(#goldGradM)" stroke-width="1"/>
      <text x="32" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#DF6C8A" text-anchor="middle">¡Hola! ✨</text>
      <text x="32" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="500" fill="#8C5A61" text-anchor="middle">¿En qué te ayudo?</text>
    </g>

    <!-- Marketing megaphone/horn icon in gold -->
    <g transform="translate(285, 110)" filter="url(#shadowM)">
      <circle cx="20" cy="20" r="22" fill="#FFFDF9" stroke="url(#goldGradM)" stroke-width="1.5"/>
      <!-- Heart/Star in circle -->
      <path d="M20 12 L22 17 L27 18 L23 22 L24 27 L20 24 L16 27 L17 22 L13 18 L18 17 Z" fill="url(#goldGradM)"/>
    </g>
  </g>

  <!-- Gold Role Banner at Bottom -->
  <g transform="translate(50, 385)">
    <rect x="0" y="0" width="300" height="46" rx="23" fill="#FFFDF9" stroke="url(#goldGradM)" stroke-width="2" filter="url(#shadowM)"/>
    <text x="150" y="22" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="#3B2E2A" text-anchor="middle">Maykelis</text>
    <text x="150" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#C5A059" text-anchor="middle" letter-spacing="1.2">ADMINISTRACIÓN &amp; VENTAS</text>
  </g>

  <!-- Little Golden Stars/Sparkles -->
  <path d="M50 75 Q50 63 56 63 Q50 63 50 51 Q50 63 44 63 Q50 63 50 75 Z" fill="url(#goldGradM)"/>
  <path d="M350 75 Q350 63 356 63 Q350 63 350 51 Q350 63 344 63 Q350 63 350 75 Z" fill="url(#goldGradM)"/>
</svg>

